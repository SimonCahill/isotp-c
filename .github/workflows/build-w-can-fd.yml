name: "CMake w/ CAN FD support"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VERSION_GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  build_w_can_fd:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check version gate
      run: make version-gate

    - name: Checkout Submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -Disotpc_MAX_CAN_FRAME_SIZE=64 -Disotpc_ENABLE_TESTING=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure


  build_w_can_fd_send_flags:
    # Builds with every CAN FD related option enabled, including the frame flags handed to the
    # user shim and the chunked reception of messages larger than the receive buffer.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check version gate
      run: make version-gate

    - name: Checkout Submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -Disotpc_MAX_CAN_FRAME_SIZE=64 -Disotpc_DEFAULT_TX_DL=32 -Disotpc_ENABLE_CAN_SEND_FLAGS=ON -Disotpc_ENABLE_CAN_FD_BRS=ON -Disotpc_ENABLE_CAN_SEND_ARG=ON -Disotpc_ENABLE_TRANSCEIVE_EVENTS=ON -Disotpc_ENABLE_STREAMING=ON -Disotpc_ENABLE_TESTING=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure


  build_w_can_fd_makefile:
    # The classic Makefile passes the frame size on through the MAX_CAN_FRAME_SIZE variable.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check version gate
      run: make version-gate

    - name: Checkout Submodules
      run: git submodule update --init --recursive

    - name: Run Makefile
      run: make MAX_CAN_FRAME_SIZE=64 all

    # Check if bin directory was created
    - name: Check build
      run: |
        if [ ! -d "bin" ]; then
          echo "Build failed: bin directory not found"
          exit 1
        fi

        if [ ! -l "bin/libisotp.so" ]; then
          echo "Build failed: libisotp.so not found"
          exit 2
        fi
